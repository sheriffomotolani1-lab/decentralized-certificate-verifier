<html lang="en">

    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --border-color: #30363d;
            --accent-color: #238636;
            --accent-hover: #2ea043;
            --text-color: #c9d1d9;
            --heading-color: #58a6ff;
            --error-color: #f85149;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 28px;
            max-width: 450px;
            width: 100%;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
        }

        h1 {
            color: var(--heading-color);
            font-size: 1.6rem;
            text-align: center;
            margin-bottom: 8px;
        }

        p.subtitle {
            font-size: 0.9rem;
            color: #8b949e;
            text-align: center;
            margin-bottom: 24px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 8px;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: #fff;
            font-family: monospace;
            font-size: 0.85rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus {
            border-color: var(--heading-color);
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: var(--accent-color);
            color: #ffffff;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: var(--accent-hover);
        }

        .result-box {
            margin-top: 24px;
            padding: 16px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            display: none;
        }

        .result-box.success {
            background-color: rgba(35, 134, 54, 0.15);
            border-color: var(--accent-color);
        }

        .result-box.error {
            background-color: rgba(248, 81, 73, 0.15);
            border-color: var(--error-color);
            color: var(--error-color);
            text-align: center;
        }

        .result-item {
            margin-bottom: 10px;
            font-size: 0.9rem;
        }

        .result-item:last-child {
            margin-bottom: 0;
        }

        .result-label {
            font-weight: bold;
            color: #8b949e;
        }

        .result-value {
            color: #ffffff;
        }
